services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neomeo
      POSTGRES_PASSWORD: neomeo
      POSTGRES_DB: neomeo
    ports:
      - "5432:5432"
    volumes:
      - neomeo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neomeo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://neomeo:neomeo@db:5432/neomeo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  neomeo_pgdata:
