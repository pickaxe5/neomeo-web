name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, semo3]
    steps:
      - name: Pull & deploy
        run: |
          set -e
          cd ~/project/neomeo-web
          git fetch origin main
          git reset --hard origin/main
          bash deploy.sh
