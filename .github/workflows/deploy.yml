name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ko
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            set -e
            cd ~/project/neomeo-web
            git pull origin main
            bash deploy.sh
